<!doctype html>
<html lang="{{ page.lang | default: 'zh-Hans' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Kotoba Snap</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
/* Self-contained: no theme gem, no webfonts, no external requests — a
   privacy policy page that phoned out to a CDN would be its own joke. */
:root {
  --bg: #FBF8F3;
  --bg-alt: #F2EBDF;
  --ink: #1C1A2E;
  --muted: #6B6478;
  --accent: #E84D2A;
  --rule: rgba(28, 26, 46, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151F;
    --bg-alt: #1E1C29;
    --ink: #ECE8E1;
    --muted: #A29CB0;
    --accent: #FF7551;
    --rule: rgba(236, 232, 225, 0.16);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg), var(--bg-alt));
  background-attachment: fixed;
  color: var(--ink);
  font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
header.site { padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule); margin-bottom: 2rem; }
header.site a.brand {
  font-weight: 800; font-size: 1.05rem; letter-spacing: .01em;
  color: var(--ink); text-decoration: none;
}
header.site a.brand span { color: var(--accent); }
h1 { font-size: 1.9rem; line-height: 1.3; margin: 0 0 .4rem; }
h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; }
h3 { font-size: 1.05rem; margin: 1.75rem 0 .5rem; }
p, li { color: var(--ink); }
a { color: var(--accent); }
blockquote {
  margin: 1.5rem 0; padding: .75rem 1rem; border-left: 3px solid var(--accent);
  background: rgba(232, 77, 42, .07); color: var(--muted);
}
blockquote p { margin: 0; color: inherit; }
code { background: rgba(28,26,46,.07); padding: .12em .35em; border-radius: 3px; font-size: .9em; }
@media (prefers-color-scheme: dark) { code { background: rgba(236,232,225,.1); } }
table { border-collapse: collapse; width: 100%; margin: 1.25rem 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--rule); padding: .5rem .7rem; text-align: left; vertical-align: top; }
th { background: rgba(28,26,46,.05); font-weight: 600; }
@media (prefers-color-scheme: dark) { th { background: rgba(236,232,225,.06); } }
.meta { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
.langswitch { margin: 0 0 2rem; font-size: .9rem; }
footer.site {
  margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);
  color: var(--muted); font-size: .875rem;
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">言葉スナップ <span>·</span> Kotoba Snap</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>Kotoba Snap · <a href="mailto:kotobasnap.support@gmail.com">kotobasnap.support@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
